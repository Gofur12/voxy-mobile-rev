name: VoxyMobile Reborn Build
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
      - name: Build mod and run Stage 11-20 smoke tests
        run: gradle build stage11SmokeTest stage12SmokeTest stage13SmokeTest stage14SmokeTest stage15SmokeTest stage16SmokeTest stage17SmokeTest stage18SmokeTest stage19SmokeTest stage20SmokeTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VoxyMobile-Reborn-Stage20
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
