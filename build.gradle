plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
}

group = 'dev.brezze'
version = '0.1.10-stage20'

base { archivesName = 'VoxyMobile-Reborn' }

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}


tasks.register('coreSmokeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.brezze.voxymobile.core.VoxelDownsampleSmokeTest'
}

check.dependsOn tasks.named('coreSmokeTest')

tasks.register('greedyMesherSmokeTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.brezze.voxymobile.core.mesh.GreedyLodMesherSmokeTest'
}

tasks.register('allCoreSmokeTests') {
    dependsOn tasks.named('coreSmokeTest'), tasks.named('greedyMesherSmokeTest')
    doLast {
        javaexec { classpath = sourceSets.test.runtimeClasspath; mainClass = 'dev.brezze.voxymobile.core.CoreSmokeTest' }
        javaexec { classpath = sourceSets.test.runtimeClasspath; mainClass = 'dev.brezze.voxymobile.core.ChunkIngestionSmokeTest' }
    }
}
check.dependsOn tasks.named('allCoreSmokeTests')


